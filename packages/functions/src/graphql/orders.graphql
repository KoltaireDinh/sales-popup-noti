query ($first: Int!) {
  orders(first: $first) {
    edges {
      node {
        id
        createdAt
        customer {
          firstName
          defaultAddress {
            city
            country
          }
        }
        lineItems(first: 1) {
          edges {
            node {
              title
              product {
                id
                images(first: 1) {
                  edges {
                    node {
                      url
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  shop {
    myshopifyDomain
  }
}
